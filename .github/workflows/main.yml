name: Build and distribute

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Matches tags like v1.0.0 and v2026.8.22.post1.

env:
  PUB_HOSTED_URL: https://pub.flutter-io.cn

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter build web --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: build/web

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
      - name: Check version code
        run: |
          VERSION=$(grep -m1 '^version:' pubspec.yaml | awk '{print $2}')
          echo "pubspec version: $VERSION"
          if [[ "$GITHUB_REF_NAME" =~ ^v([0-9]{4})\.([0-9]{1,2})\.([0-9]{1,2})(\.?post([0-9]+))?$ ]]; then
            YEAR=$((10#${BASH_REMATCH[1]}))
            MONTH=$((10#${BASH_REMATCH[2]}))
            DAY=$((10#${BASH_REMATCH[3]}))
            POST=$((10#${BASH_REMATCH[5]:-0}))
            CODE=$(printf '%04d%02d%02d%02d' "$YEAR" "$MONTH" "$DAY" "$POST")
            echo "tag $GITHUB_REF_NAME implies versionCode $CODE"
            if [ "${VERSION#*+}" != "$CODE" ]; then
              echo "::warning::pubspec build number (${VERSION#*+}) does not match tag-derived versionCode ($CODE). Bump 'version:' in pubspec.yaml so local and CI builds stay installable over each other."
            fi
          fi
      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD secrets are not set. Without them the build would silently fall back to the debug key and produce an APK nobody can install over an existing install."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/moetalk-release.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=moetalk-release.jks\n' \
            "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" "${KEY_ALIAS:-moetalk}" > android/key.properties
      - run: flutter pub get --enforce-lockfile
      - run: flutter build apk --release --no-pub
      - name: Verify APK signing key
        env:
          EXPECTED_CERT_SHA256: 'E97A6C5F393882565EDFF28D83D4D1A40C448281E16F587DF3E54FAA6A8BCA14'
        run: |
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          echo "using $APKSIGNER"
          # The prefix of the certificate lines changes between build-tools
          # releases ("Signer #1 certificate SHA-256 digest:" up to 36.x,
          # "V2 Signer: certificate SHA-256 digest:" in 37.x), so never anchor a
          # match at the start of the line - match the stable suffix instead.
          set +e
          OUT=$("$APKSIGNER" verify --print-certs "$APK" 2>&1)
          RC=$?
          set -e
          printf '%s\n' "$OUT" | grep -E 'certificate (DN|SHA-256 digest):' || true
          if [ "$RC" -ne 0 ]; then
            echo "::error::apksigner could not verify $APK (exit $RC) - the APK is not correctly signed."
            exit 1
          fi
          ACTUAL=$(printf '%s\n' "$OUT" | sed -n 's/.*certificate SHA-256 digest: *//p' \
            | head -n1 | tr -d ':' | tr 'a-f' 'A-F')
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read a signing certificate from $APK - apksigner output had no SHA-256 digest line."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::APK is signed with an unexpected key ($ACTUAL). Expected the fixed release key - the keystore secret is wrong, or key.properties was not restored, so this build could not be installed over an existing install."
            exit 1
          fi
          echo "Release signing key verified: $ACTUAL"
      - run: cp build/app/outputs/flutter-apk/app-release.apk build/MisonoTalk-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: build/MisonoTalk-android.apk

  windows:
    name: windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter build windows --release --no-pub
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/MisonoTalk-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: build/MisonoTalk-windows-x64.zip

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [web, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-web
          path: release-web
      - run: |
          mkdir -p release
          cd release-web
          zip -r ../release/MisonoTalk-web.zip .
      - uses: actions/download-artifact@v4
        with:
          name: release-android
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: release
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*

  deploy:
    name: deploy
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: release-web
        path: ./build

    - name: Deploy to gh-pages
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
